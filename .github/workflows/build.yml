name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    # Package.swift needs swift-tools-version 6.4, which ships with Xcode 27.
    # `xcode-27` is GitHub's (preview) arm64 image carrying it.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        # Unit tests only; integration tests are gated behind RUN_CONTOUR_INTEGRATION.
        # This already includes BenchTests below; it's run again on its own so the
        # per-milestone numbers land in a clearly labeled step of the log rather than
        # being buried in the full suite's output.
        run: swift test --enable-code-coverage

      - name: Code coverage report
        run: |
          # The build output layout varies by build system (classic SwiftPM vs.
          # the Xcode-style Swift Build backend), so locate the artifacts instead
          # of assuming a fixed path under `swift build --show-bin-path`.
          TEST_BINARY="$(find .build -type f -path '*.xctest/Contents/MacOS/*' -print -quit)"
          PROFDATA="$(find .build -type f -name 'default.profdata' -print -quit)"

          if [ -z "$TEST_BINARY" ] || [ -z "$PROFDATA" ]; then
            echo "::error::Could not locate test binary or coverage profile under .build"
            find .build \( -iname '*.xctest' -o -iname '*.profdata' \)
            exit 1
          fi

          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            | tee coverage-summary.txt

          {
            echo '### Code coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          xcrun llvm-cov export "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            -format=lcov > coverage.lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov

      - name: Bench (Contour's own latency, offline, issue #60)
        # No real model, no network: measures Contour's own share of "time to a useful
        # Overview" (DESIGN.md §13) against a fixed fixture corpus and fails the job on a
        # regression past a deliberately generous threshold — see BenchTests.swift.
        run: swift test --filter BenchTests

      - name: Build release
        run: swift build -c release

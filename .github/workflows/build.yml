name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    # Package.swift needs swift-tools-version 6.4, which ships with Xcode 27.
    # `xcode-27` is GitHub's (preview) arm64 image carrying it.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        # Unit tests only; integration tests are gated behind RUN_CONTOUR_INTEGRATION.
        run: swift test

      - name: Build release
        run: swift build -c release

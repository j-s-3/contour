name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    # Package.swift needs swift-tools-version 6.4, which ships with Xcode 27.
    # `xcode-27` is GitHub's (preview) arm64 image carrying it.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        # Unit tests only; integration tests are gated behind RUN_CONTOUR_INTEGRATION.
        run: swift test --enable-code-coverage

      - name: Code coverage report
        run: |
          # The build output layout varies by build system (classic SwiftPM vs.
          # the Xcode-style Swift Build backend), so locate the artifacts instead
          # of assuming a fixed path under `swift build --show-bin-path`.
          TEST_BINARY="$(find .build -type f -path '*.xctest/Contents/MacOS/*' -print -quit)"
          PROFDATA="$(find .build -type f -name 'default.profdata' -print -quit)"

          if [ -z "$TEST_BINARY" ] || [ -z "$PROFDATA" ]; then
            echo "::error::Could not locate test binary or coverage profile under .build"
            find .build \( -iname '*.xctest' -o -iname '*.profdata' \)
            exit 1
          fi

          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            | tee coverage-summary.txt

          {
            echo '### Code coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          xcrun llvm-cov export "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            -format=lcov > coverage.lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov

      - name: Test under Thread Sanitizer
        # Same unit tests, instrumented for data races: the pipeline is an actor, `Shell`
        # bridges GCD's readabilityHandler/terminationHandler callbacks into Swift
        # Concurrency, and AnalysisService.modelOverrides is a lock-protected static var —
        # exactly the shapes TSan is good at catching and Package.swift's Swift 5 language
        # mode doesn't check at compile time. A separate `swift test` invocation (not
        # `--enable-code-coverage`, and run after the coverage steps above) so it can't
        # confuse their search for the coverage-instrumented test binary and profile under
        # `.build`. continue-on-error for now, while the baseline is established; the goal
        # is to make this a hard gate once it's clean.
        continue-on-error: true
        run: swift test --sanitize=thread

      - name: Build release
        run: swift build -c release

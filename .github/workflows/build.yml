name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    # Package.swift needs swift-tools-version 6.4, which ships with Xcode 27.
    # `xcode-27` is GitHub's (preview) arm64 image carrying it.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        # Unit tests only; integration tests are gated behind RUN_CONTOUR_INTEGRATION.
        # This already includes BenchTests below; it's run again on its own so the
        # per-milestone numbers land in a clearly labeled step of the log rather than
        # being buried in the full suite's output.
        run: |
          set -o pipefail
          swift test --enable-code-coverage 2>&1 | tee test-output.log

      - name: No main-actor isolation warnings (issue #185)
        # Members of a `View` are implicitly `@MainActor`; calling one from a nonisolated
        # `@Test` is only a warning today because SwiftUI's isolation is @preconcurrency, but
        # it becomes a hard error under Swift 6 language mode (#72). Pure helpers on views are
        # declared `nonisolated`; anything that genuinely needs the main actor is called from
        # a `@MainActor` test. Fail here so new instances don't pile up silently again.
        run: |
          PATTERN="main actor-isolated .* in a (synchronous )?nonisolated context"
          # Strip color codes and OSC-8 links so the list reads cleanly in the annotation.
          perl -pe 's/\e\[[0-9;]*m//g; s/\e\]8;;.*?\e\\//g' test-output.log \
            | grep -E "$PATTERN" | sed -E "s|^$GITHUB_WORKSPACE/||" | sort -u > isolation-warnings.txt || true
          if [ -s isolation-warnings.txt ]; then
            cat isolation-warnings.txt
            # One annotation carrying the whole list, so it's readable from the checks API too.
            LIST="$(sed -E 's/%/%25/g' isolation-warnings.txt | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Main-actor isolation warnings::$(wc -l < isolation-warnings.txt | tr -d ' ') found. Mark pure View helpers 'nonisolated' or make the test @MainActor.%0A$LIST"
            exit 1
          fi

      - name: Code coverage report
        run: |
          # The build output layout varies by build system (classic SwiftPM vs.
          # the Xcode-style Swift Build backend), so locate the artifacts instead
          # of assuming a fixed path under `swift build --show-bin-path`.
          TEST_BINARY="$(find .build -type f -path '*.xctest/Contents/MacOS/*' -print -quit)"
          PROFDATA="$(find .build -type f -name 'default.profdata' -print -quit)"

          if [ -z "$TEST_BINARY" ] || [ -z "$PROFDATA" ]; then
            echo "::error::Could not locate test binary or coverage profile under .build"
            find .build \( -iname '*.xctest' -o -iname '*.profdata' \)
            exit 1
          fi

          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            | tee coverage-summary.txt

          {
            echo '### Code coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          xcrun llvm-cov export "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            -format=lcov > coverage.lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov

      - name: Bench (Contour's own latency, offline, issue #60)
        # No real model, no network: measures Contour's own share of "time to a useful
        # Overview" (DESIGN.md §13) against a fixed fixture corpus and fails the job on a
        # regression past a deliberately generous threshold — see BenchTests.swift.
        run: swift test --filter BenchTests

      - name: Test under Thread Sanitizer
        # Same unit tests, instrumented for data races: the pipeline is an actor, `Shell`
        # bridges GCD's readabilityHandler/terminationHandler callbacks into Swift
        # Concurrency, and AnalysisService.modelOverrides is a lock-protected static var —
        # exactly the shapes TSan is good at catching and Package.swift's Swift 5 language
        # mode doesn't check at compile time. A separate `swift test` invocation (not
        # `--enable-code-coverage`, and run after the coverage steps above) so it can't
        # confuse their search for the coverage-instrumented test binary and profile under
        # `.build`. continue-on-error for now, while the baseline is established; the goal
        # is to make this a hard gate once it's clean.
        continue-on-error: true
        # The benchmark suites are skipped here: they exist to time large inputs, and
        # under the sanitizer's slowdown they would only stretch the job without adding a
        # race the ordinary suites don't already exercise.
        run: swift test --sanitize=thread --skip BenchmarkTests --skip BenchTests

      - name: Build release
        run: swift build -c release

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    # Package.swift needs swift-tools-version 6.4, which ships with Xcode 27.
    # `xcode-27` is GitHub's (preview) arm64 image carrying it.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        # Unit tests only; integration tests are gated behind RUN_CONTOUR_INTEGRATION.
        run: swift test --enable-code-coverage

      - name: Code coverage report
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          TEST_BINARY="$BIN_PATH/ContourPackageTests.xctest/Contents/MacOS/ContourPackageTests"
          PROFDATA="$BIN_PATH/codecov/default.profdata"

          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            | tee coverage-summary.txt

          {
            echo '### Code coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          xcrun llvm-cov export "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            -format=lcov > coverage.lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov

      - name: Build release
        run: swift build -c release

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    # Package.swift needs swift-tools-version 6.4, which ships with Xcode 27.
    # `xcode-27` is GitHub's (preview) arm64 image carrying it.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Lint (swift-format)
        # swift-format ships with the toolchain; rules and layout live in .swift-format.
        # --strict turns every finding, including unformatted code, into a failure.
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

      - name: Build
        run: swift build

      - name: Bench (Contour's own latency, offline, issue #60)
        # No real model, no network: measures Contour's own share of "time to a useful
        # Overview" (DESIGN.md §13) against a fixed fixture corpus and fails the job on a
        # regression past a deliberately generous threshold — see BenchTests.swift.
        # BenchmarkTests (timing-only large-input suites) run here too, since they are
        # skipped under the sanitizer.
        run: swift test --filter 'BenchTests|BenchmarkTests'

      - name: Test under Thread Sanitizer
        # The unit-test run: instruments for data races (the pipeline is an actor, `Shell`
        # bridges GCD's readabilityHandler/terminationHandler callbacks into Swift
        # Concurrency, and AnalysisService.modelOverrides is a lock-protected static var)
        # and, as the only full-suite run in this job, also produces the coverage profile
        # and the test-output.log that the steps below consume. Integration tests are gated
        # behind RUN_CONTOUR_INTEGRATION. BenchTests and BenchmarkTests run in the step above.
        #
        # A hard gate: a failing test or a reported data race fails the job. The benchmark
        # suites are skipped: they time large inputs, and under the sanitizer's slowdown
        # they would only stretch the job.
        run: |
          set -o pipefail
          swift test --sanitize=thread --enable-code-coverage \
            --skip BenchmarkTests --skip BenchTests 2>&1 | tee test-output.log

      - name: No main-actor isolation warnings (issue #185)
        # Members of a `View` are implicitly `@MainActor`; calling one from a nonisolated
        # `@Test` is only a warning today because SwiftUI's isolation is @preconcurrency, but
        # it becomes a hard error under Swift 6 language mode (#72). Pure helpers on views are
        # declared `nonisolated`; anything that genuinely needs the main actor is called from
        # a `@MainActor` test. Fail here so new instances don't pile up silently again.
        run: |
          PATTERN="main actor-isolated .* in a (synchronous )?nonisolated context"
          # Strip color codes and OSC-8 links so the list reads cleanly in the annotation.
          perl -pe 's/\e\[[0-9;]*m//g; s/\e\]8;;.*?\e\\//g' test-output.log \
            | grep -E "$PATTERN" | sed -E "s|^$GITHUB_WORKSPACE/||" | sort -u > isolation-warnings.txt || true
          if [ -s isolation-warnings.txt ]; then
            cat isolation-warnings.txt
            # One annotation carrying the whole list, so it's readable from the checks API too.
            LIST="$(sed -E 's/%/%25/g' isolation-warnings.txt | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Main-actor isolation warnings::$(wc -l < isolation-warnings.txt | tr -d ' ') found. Mark pure View helpers 'nonisolated' or make the test @MainActor.%0A$LIST"
            exit 1
          fi

      - name: Code coverage report
        run: |
          # The build output layout varies by build system (classic SwiftPM vs.
          # the Xcode-style Swift Build backend), so locate the artifacts instead
          # of assuming a fixed path under `swift build --show-bin-path`.
          TEST_BINARY="$(find .build -type f -path '*.xctest/Contents/MacOS/*' -print -quit)"
          PROFDATA="$(find .build -type f -name 'default.profdata' -print -quit)"

          if [ -z "$TEST_BINARY" ] || [ -z "$PROFDATA" ]; then
            echo "::error::Could not locate test binary or coverage profile under .build"
            find .build \( -iname '*.xctest' -o -iname '*.profdata' \)
            exit 1
          fi

          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            | tee coverage-summary.txt

          {
            echo '### Code coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          xcrun llvm-cov export "$TEST_BINARY" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|Tests/' \
            -format=lcov > coverage.lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.lcov
            coverage-summary.txt

      - name: Build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: swift build -c release

  coverage-badge:
    name: Publish coverage badge
    # Main only: the README badge reads coverage.json from the `badges` branch through
    # shields.io's endpoint badge. A separate job so only this small step gets write access.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Push coverage.json to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Line coverage is the 10th column of llvm-cov's TOTAL row, the same figure the
          # job summary shows.
          PERCENT="$(awk '$1 == "TOTAL" { sub(/%/, "", $10); print $10 }' coverage-summary.txt)"
          if [ -z "$PERCENT" ]; then
            echo "::error::No TOTAL row in coverage-summary.txt"
            cat coverage-summary.txt
            exit 1
          fi
          # Colors step toward the 90% target set in CLAUDE.md.
          COLOR="$(awk -v p="$PERCENT" 'BEGIN {
            if (p >= 90) print "brightgreen"; else if (p >= 80) print "green";
            else if (p >= 70) print "yellowgreen"; else if (p >= 60) print "yellow";
            else if (p >= 50) print "orange"; else print "red" }')"
          echo "Line coverage: ${PERCENT}% (${COLOR})"

          git init -q badges
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Build on the existing branch so every push is a fast-forward; start an orphan
          # branch the first time.
          if git fetch -q --depth 1 origin badges; then
            git checkout -q -b badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi

          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PERCENT" "$COLOR" > coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged; nothing to push."
            exit 0
          fi
          git commit -q -m "Coverage ${PERCENT}% at ${GITHUB_SHA::7}"
          git push -q origin badges
